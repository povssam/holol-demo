function run(D){
let S=JSON.parse(localStorage.getItem(KEY)||'{}');let open=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>new Date().toISOString().slice(0,10);
const my=()=>(localStorage.getItem(KEY+'-no')||'').replace(/\D/g,'');
const links=()=>{const q=my().length>=9?'?wa='+my():'';return {L1:D.L1+q,L2:D.L1+q+'#camera'}};
const msg=(k,l)=>{const L=links();return D.M[k][l].replace('{L1}',L.L1).replace('{L2}',L.L2)};
const wa=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t);
const st=id=>S[id]||(S[id]={log:[]});
function mark(id,k){const s=st(id);s[k]=today();s.log.push([k,Date.now()]);save();}
function status(s){if(!s.sent)return 0;if(s.booked)return 5;if(s.no)return 4;if(s.yes)return 2;if(s.na)return 3;return 1}
function tagOf(s){return s.booked?'<span class="tag b">Booked</span>':s.no?'<span class="tag n">La</span>':s.yes?'<span class="tag y">Ah</span>':s.na?'<span class="tag">Ma jawbch</span>':s.sent?'<span class="tag">Sent</span>':''}
function card(L){const s=st(L.id),x=status(s),done=x>=3;
 let h=`<div class="head"><h3>${L.n}</h3><small>${L.c} · ${L.l==='fr'?'FR':'Darija'}</small></div>`;
 const big=(cls,k,txt,label)=>`<a class="btn ${cls}" href="${wa(L.p,txt)}" target="_blank" rel="noopener" data-id="${L.id}" data-mark="${k}">${label}</a>`;
 if(!s.sent){h+=big('btn--wa','sent',L.m,'Send');}
 else{h+=`<div>${tagOf(s)}</div>`;
  if(!s.yes&&!s.no){h+=`<div class="row3"><button class="btn btn--sm" data-id="${L.id}" data-set="yes">Ah ✅</button><button class="btn btn--line btn--sm" data-id="${L.id}" data-set="no">La</button><button class="btn btn--ghost btn--sm" data-id="${L.id}" data-set="na">Ma jawbch</button></div>`;
   if(s.na&&!s.relance)h+=big('btn--line btn--sm','relance',msg('relance',L.l),'Relance (mn ba3d 2 iyam)');}

   if(!s.booked)h+=`<button class="btn btn--sm" data-id="${L.id}" data-set="booked">Booked ✅ (9bel l call)</button>`;
   h+=`<div class="row2">${big('btn--ghost btn--sm','px',msg('price',L.l),'Bchhal? →')}${big('btn--ghost btn--sm','wh',msg('what',L.l),'Chno hada? →')}</div>`;}
  if(s.no&&!s.thx)h+=big('btn--line btn--sm','thx',msg('no',L.l),'Chokran (message)');
  if(done||s.yes)h+=`<button class="btn btn--ghost btn--sm more" data-id="${L.id}" data-set="undo">↩ Undo</button>`;}
 return `<article class="card ${done?'done':''}">${h}</article>`;}
function render(){const arr=D.leads.slice().sort((a,b)=>{const r=x=>{const v=status(st(x.id));return v>=3?10+v:v===2?-1:v};return r(a)-r(b)});
 document.getElementById('list').innerHTML=arr.map(card).join('');
