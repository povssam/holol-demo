  if(s.yes){const steps=[['v1','yes','1 · Video ventes'],['v2','cam','2 · Video camera'],['bk','book','3 · Book call']];
   steps.forEach(([k,m,lab],i)=>{h+=`<div class="step ${s[k]?'ok':''}"><i>${s[k]?'✓':i+1}</i>${big(s[k]?'btn--line btn--sm':'btn--wa btn--sm',k,msg(m,L.l),lab.slice(4))}</div>`});
   if(!s.booked)h+=`<button class="btn btn--sm" data-id="${L.id}" data-set="booked">Booked ✅ <span class="ar" dir="rtl">(قبل الكول)</span></button>`;
   h+=`<div class="row2">${big('btn--ghost btn--sm','px',msg('price',L.l),'<span class="ar" dir="rtl">بشحال؟</span>')}${big('btn--ghost btn--sm','wh',msg('what',L.l),'<span class="ar" dir="rtl">شنو هادا؟</span>')}</div>`;}
  if(s.no&&!s.thx)h+=big('btn--line btn--sm','thx',msg('no',L.l),'<span class="ar" dir="rtl">شكرا (ميساج)</span>');
  if(done||s.yes)h+=`<button class="btn btn--ghost btn--sm more" data-id="${L.id}" data-set="undo">↩ Undo</button>`;}
 return `<article class="card ${done?'done':''}">${h}</article>`;}
function render(){const arr=D.leads.slice().sort((a,b)=>{const r=x=>{const v=status(st(x.id));return v>=3?10+v:v===2?-1:v};return r(a)-r(b)});
 document.getElementById('list').innerHTML=arr.map(card).join('');
 const t=today();let S1=0,Y=0,B=0,left=0;D.leads.forEach(L=>{const s=st(L.id);if(s.sent===t)S1++;if(s.yes===t)Y++;if(s.booked===t)B++;if(!s.sent)left++});
 sS.textContent=S1;sY.textContent=Y;sB.textContent=B;sL.textContent=left;document.getElementById('today').textContent='اليوم';
 const L=links();l1.textContent='شوف هنا: '+L.L1;l2.textContent='شوف هنا: '+L.L2;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-mark]');if(a){mark(a.dataset.id,a.dataset.mark);setTimeout(render,300);return}
 const b=e.target.closest('[data-set]');if(b){const s=st(b.dataset.id),k=b.dataset.set;
  if(k==='undo'){['yes','no','na','booked','v1','v2','bk','relance','thx'].forEach(x=>delete s[x]);const ts=Date.now();s.log.push(['undo',ts]);ev(b.dataset.id,'undo',ts);}
  else{if(k!=='booked')['yes','no','na'].forEach(x=>delete s[x]);mark(b.dataset.id,k);}save();render();return}
 const c=e.target.closest('[data-copy]');if(c){const t=document.getElementById(c.dataset.copy).textContent;navigator.clipboard?.writeText(t).then(()=>{c.textContent='Copied ✓';setTimeout(render,1200)}).catch(()=>{})}
 if(e.target.id==='reset'&&confirm('نمسحو كلشي؟')){S={};save();render()}});
const no=document.getElementById('myno');no.value=localStorage.getItem(K0+'-no')||'';no.addEventListener('input',()=>{localStorage.setItem(K0+'-no',no.value);render()});
dltxt.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([D.txt],{type:'text/plain'}));a.download='holol-script.txt';a.click()};
render();flush();}
