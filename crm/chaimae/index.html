 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(E.s),iterations:E.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(E.iv)},k,ub(E.ct))))}
async function unlock(pin,auto){pinmsg.textContent='...';try{const D=await dec(pin);localStorage.setItem(PK,pin);lock.classList.add('hide');app.classList.remove('hide');run(D)}catch(e){if(auto)localStorage.removeItem(PK);pinmsg.textContent=auto?'':'PIN غالط'}}
pinf.addEventListener('submit',e=>{e.preventDefault();unlock(pin.value.trim(),false)});
if(localStorage.getItem(PK))unlock(localStorage.getItem(PK),true);
function run(D){
let S=JSON.parse(localStorage.getItem(KEY)||'{}');let open=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>new Date().toISOString().slice(0,10);
const my=()=>(localStorage.getItem(K0+'-no')||'').replace(/\D/g,'');
const links=()=>{const q=my().length>=9?'?wa='+my():'';return {L1:D.L1+q,L2:D.L1+q+'#camera'}};
const msg=(k,l)=>{const L=links();return D.M[k][l].replace('{L1}',L.L1).replace('{L2}',L.L2)};
const wa=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t);
const st=id=>S[id]||(S[id]={log:[]});
function mark(id,k){const s=st(id),ts=Date.now();s[k]=today();s.log.push([k,ts]);save();ev(id,k,ts);}
const QK=KEY+'-q';let Q=JSON.parse(localStorage.getItem(QK)||'[]'),busy=false,off=false;
const leadOf=id=>D.leads.find(l=>l.id===id);
function ev(id,type,at,quiet){const L=leadOf(id);if(!L)return;const e={id:L.p+':'+type+':'+at,lead:L.p,name:L.n,city:L.c,type,at,v:L.v||''};if(!Q.some(x=>x.id===e.id))Q.push(e);localStorage.setItem(QK,JSON.stringify(Q));if(!quiet)flush();}
function sui(){const el=document.getElementById('sync');el.textContent=off?'sync off':!Q.length?'✓ synced':(navigator.onLine?'⏳ ':'offline · ')+Q.length;el.className='tag'+(Q.length||off?'':' y');}
async function flush(){sui();if(busy||off||!Q.length||!D.tok||!navigator.onLine)return;busy=true;let again=false;
 try{const batch=Q.slice(0,50);const r=await fetch('/api/events',{method:'POST',keepalive:true,headers:{'content-type':'application/json',authorization:'Bearer '+D.tok},body:JSON.stringify({events:batch})});
  if(r.ok){const ids=new Set(batch.map(x=>x.id));Q=Q.filter(x=>!ids.has(x.id));localStorage.setItem(QK,JSON.stringify(Q));again=Q.length>0}else if(r.status===401||r.status===403)off=true;}catch(e){}
 busy=false;sui();if(again)flush();}
if(!localStorage.getItem(KEY+'-bf')){Object.entries(S).forEach(([id,s])=>(s.log||[]).forEach(([k,ts])=>ev(id,k,ts,true)));localStorage.setItem(KEY+'-bf','1');}
addEventListener('online',flush);document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});setInterval(flush,20000);
function status(s){if(!s.sent)return 0;if(s.booked)return 5;if(s.no)return 4;if(s.yes)return 2;if(s.na)return 3;return 1}
function tagOf(s){return s.booked?'<span class="tag b">Booked</span>':s.no?'<span class="tag n ar">لا</span>':s.yes?'<span class="tag y ar">آه</span>':s.na?'<span class="tag ar">ما جاوبش</span>':s.sent?'<span class="tag">Sent</span>':''}
function card(L){const s=st(L.id),x=status(s),done=x>=3;
 let h=`<div class="head"><h3>${L.n}</h3><small>${L.c} · ${L.l==='fr'?'FR':'الدارجة'}</small></div>`+(L.x?`<div class="ar" dir="rtl" style="color:#b45309;font-size:.85rem;margin:.2rem 0">⚠️ ${L.x}</div>`:'');
 const big=(cls,k,txt,label)=>`<a class="btn ${cls}" href="${wa(L.p,txt)}" target="_blank" rel="noopener" data-id="${L.id}" data-mark="${k}">${label}</a>`;
 if(!s.sent){h+=big('btn--wa','sent',L.m,'Send');}
 else{h+=`<div>${tagOf(s)}</div>`;
  if(!s.yes&&!s.no){h+=`<div class="row3"><button class="btn btn--sm" data-id="${L.id}" data-set="yes"><span class="ar">آه</span> ✅</button><button class="btn btn--line btn--sm" data-id="${L.id}" data-set="no"><span class="ar">لا</span></button><button class="btn btn--ghost btn--sm" data-id="${L.id}" data-set="na"><span class="ar">ما جاوبش</span></button></div>`;
   if(s.na&&!s.relance)h+=big('btn--line btn--sm','relance',msg('relance',L.l),'<span class="ar" dir="rtl">عاودي صيفطي (من بعد يومين)</span>');}
  if(s.yes){const steps=[['v1','yes','1 · Video ventes'],['v2','cam','2 · Video camera'],['bk','book','3 · Book call']];
   steps.forEach(([k,m,lab],i)=>{h+=`<div class="step ${s[k]?'ok':''}"><i>${s[k]?'✓':i+1}</i>${big(s[k]?'btn--line btn--sm':'btn--wa btn--sm',k,msg(m,L.l),lab.slice(4))}</div>`});
   if(!s.booked)h+=`<button class="btn btn--sm" data-id="${L.id}" data-set="booked">Booked ✅ <span class="ar" dir="rtl">(قبل الكول)</span></button>`;
   h+=`<div class="row2">${big('btn--ghost btn--sm','px',msg('price',L.l),'<span class="ar" dir="rtl">بشحال؟</span>')}${big('btn--ghost btn--sm','wh',msg('what',L.l),'<span class="ar" dir="rtl">شنو هادا؟</span>')}</div>`;}
  if(s.no&&!s.thx)h+=big('btn--line btn--sm','thx',msg('no',L.l),'<span class="ar" dir="rtl">شكرا (ميساج)</span>');
  if(done||s.yes)h+=`<button class="btn btn--ghost btn--sm more" data-id="${L.id}" data-set="undo">↩ Undo</button>`;}
 return `<article class="card ${done?'done':''}">${h}</article>`;}
function render(){const arr=D.leads.slice().sort((a,b)=>{const r=x=>{const v=status(st(x.id));return v>=3?10+v:v===2?-1:v};return r(a)-r(b)});
 document.getElementById('list').innerHTML=arr.map(card).join('');
 const t=today();let S1=0,Y=0,B=0,left=0;D.leads.forEach(L=>{const s=st(L.id);if(s.sent===t)S1++;if(s.yes===t)Y++;if(s.booked===t)B++;if(!s.sent)left++});
 sS.textContent=S1;sY.textContent=Y;sB.textContent=B;sL.textContent=left;document.getElementById('today').textContent='اليوم';
 const L=links();l1.textContent='شوف هنا: '+L.L1;l2.textContent='شوف هنا: '+L.L2;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-mark]');if(a){mark(a.dataset.id,a.dataset.mark);setTimeout(render,300);return}
 const b=e.target.closest('[data-set]');if(b){const s=st(b.dataset.id),k=b.dataset.set;
  if(k==='undo'){['yes','no','na','booked','v1','v2','bk','relance','thx'].forEach(x=>delete s[x]);const ts=Date.now();s.log.push(['undo',ts]);ev(b.dataset.id,'undo',ts);}
  else{if(k!=='booked')['yes','no','na'].forEach(x=>delete s[x]);mark(b.dataset.id,k);}save();render();return}
 const c=e.target.closest('[data-copy]');if(c){const t=document.getElementById(c.dataset.copy).textContent;navigator.clipboard?.writeText(t).then(()=>{c.textContent='Copied ✓';setTimeout(render,1200)}).catch(()=>{})}
 if(e.target.id==='reset'&&confirm('نمسحو كلشي؟')){S={};save();render()}});
const no=document.getElementById('myno');no.value=localStorage.getItem(K0+'-no')||'';no.addEventListener('input',()=>{localStorage.setItem(K0+'-no',no.value);render()});
dltxt.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([D.txt],{type:'text/plain'}));a.download='holol-script.txt';a.click()};
render();flush();}
</script></body></html>
